<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <title>Ukubona</title>

  <!-- Favicon -->
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-light.ico" type="image/x-icon" />
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-light.ico" type="image/x-icon" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="https://abikesa.github.io/favicon/assets/favicon-dark.ico" type="image/x-icon" media="(prefers-color-scheme: dark)" />

  <!-- Logo Preloads -->
  <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-light.png" as="image" />
  <link rel="preload" href="https://abikesa.github.io/logos/assets/ukubona-dark.png" as="image" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-light: #ffffff;
      --bg-dark: #000000;
    }

    html[data-theme='light'] {
      background-color: var(--bg-light);
    }

    html[data-theme='dark'] {
      background-color: var(--bg-dark);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
      transition: background-color 0.3s ease;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 960px;
      padding: 1.5rem 1rem;
    }

    .top-right {
      position: fixed;
      top: 0.75rem;
      right: 0.75rem;
      z-index: 1000;
    }

    #toggle-theme {
      cursor: pointer;
      background: transparent;
      border: none;
      font-size: 1.3rem;
      color: inherit;
    }

    header {
      text-align: center;
    }

    #logo {
      max-width: 100%;
      width: min(160px, 40vw);
      height: auto;
      animation: spin 60s linear infinite;
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }

    body.loaded #logo {
      opacity: 1;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #logo.light-mode-fix {
      animation: spin-light 60s linear infinite !important;
    }

    @keyframes spin-light {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1) rotate(360deg); }
    }

    .tagline {
      font-size: 1.1rem;
      margin: 1rem auto 2rem;
      color: #888;
      text-align: center;
      max-width: 700px;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      padding: 1rem 0;
      width: 100%;
      max-width: 720px;
      place-items: center;
      min-width: 0;
      margin: 0 auto;
      text-align: center;
    }
    

    .app-grid a {
      text-decoration: none;
      text-align: center;
      padding: 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 1px solid transparent;
      transition: transform 0.2s, background-color 0.2s;
      opacity: 0;
      animation: fadeInTile 0.5s ease forwards;
      width: auto;
      max-width: 100%;
    }
    
    

    .icon-box {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    @keyframes fadeInTile {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    html[data-theme='light'] .app-grid a {
      background-color: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.05);
      color: #111;
    }

    html[data-theme='light'] .app-grid a:hover {
      background-color: rgba(0, 0, 0, 0.07);
      transform: scale(1.03);
    }

    html[data-theme='dark'] .app-grid a {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #eee;
    }

    html[data-theme='dark'] .app-grid a:hover {
      background-color: rgba(255, 255, 255, 0.1);
      transform: scale(1.03);
    }

    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.85rem;
      color: #777;
      padding-bottom: 2rem;
    }
  </style>
</head>

<body>
  <div class="top-right">
    <button id="toggle-theme">🌞 / 🌙</button>
  </div>

  <div class="container">
    <header>
      <img
        src="https://abikesa.github.io/logos/assets/ukubona-dark.png"
        alt="Ukubona Logo"
        id="logo"
        loading="eager"
      />
      <div class="tagline">Epistemic Interfaces for Real-Time Clinical and Public Health Decisions</div>
    </header>

    <main>
      <div class="app-grid" id="gridMenu"></div>
    </main>

    <footer>
      “To see is not only to look — it is to attend, to interpret, and to respond.”<br/>
      &copy; 2025 Ukubona LLC
    </footer>
  </div>

  <script>
    const html = document.documentElement;
    const toggleBtn = document.getElementById('toggle-theme');
    const logo = document.getElementById('logo');
    const LIGHT_LOGO = 'https://abikesa.github.io/logos/assets/ukubona-light.png';
    const DARK_LOGO  = 'https://abikesa.github.io/logos/assets/ukubona-dark.png';

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      logo.src = theme === 'dark' ? DARK_LOGO : LIGHT_LOGO;
      toggleBtn.textContent = theme === 'dark' ? '🌙' : '🌞';
      logo.classList.toggle('light-mode-fix', theme === 'light');
    }

    setTheme(localStorage.getItem('theme') || 'dark');

    toggleBtn.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });

    const links = [
      { name: 'Mission', url: './html/mission.html', icon: '📘' },
      { name: 'Models', url: './html/models.html', icon: '📊' },
      { name: 'About', url: './html/collaborators.html', icon: '👥' },
      { name: 'Contact', url: './html/contact.html', icon: '✉️' },
      { name: 'Docs', url: './html/contact.html', icon: '🧾' },

    ];

    const menu = document.getElementById('gridMenu');
    links.forEach((link, i) => {
      const a = document.createElement('a');
      a.href = link.url;
      a.target = '_blank';
      a.style.animationDelay = `${i * 0.03}s`;

      const icon = document.createElement('div');
      icon.textContent = link.icon;
      icon.className = 'icon-box';

      a.appendChild(icon);
      a.appendChild(document.createTextNode(link.name));
      menu.appendChild(a);
    });

    window.addEventListener('load', () => {
      document.body.classList.add('loaded');
    });
  </script>
</body>
</html>
